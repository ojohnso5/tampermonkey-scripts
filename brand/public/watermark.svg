<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Justice Society of Activism watermark">

  <radialGradient id="WCore" cx=".38" cy=".30" r=".82">
    <stop offset="0" stop-color="#DFF6FF"/>
    <stop offset=".14" stop-color="#6FD8FA"/>
    <stop offset=".42" stop-color="#00AEEF"/>
    <stop offset=".78" stop-color="#0A6394"/>
    <stop offset="1" stop-color="#053B5C"/>
  </radialGradient>
  <linearGradient id="WGold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F6E7B4"/><stop offset=".22" stop-color="#D4AF37"/>
    <stop offset=".48" stop-color="#8A6D1F"/><stop offset=".7" stop-color="#D4AF37"/>
    <stop offset="1" stop-color="#F6E7B4"/>
  </linearGradient>
  <radialGradient id="WRedGlow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#E11937" stop-opacity=".30"/>
    <stop offset=".42" stop-color="#E11937" stop-opacity=".11"/>
    <stop offset=".76" stop-color="#E11937" stop-opacity=".03"/>
    <stop offset="1" stop-color="#E11937" stop-opacity="0"/>
  </radialGradient>
  <filter id="WGlobeFx" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="5.12" result="sblur"/>
    <feOffset in="sblur" dx="0" dy="2.56" result="soff"/>
    <feFlood flood-color="#000000" flood-opacity="0.5" result="scol"/>
    <feComposite in="scol" in2="soff" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="WGlow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="WSoft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <filter id="WGoldGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <!-- Watermark legibility: a dark drop shadow so the mark holds up over
       bright footage, plus a gold bloom so it holds up over dark footage. -->
  <filter id="WEmblemFx" x="-60%" y="-60%" width="220%" height="220%">
    <!-- tight dark contour hugging the letterforms: this is what keeps the
         mark legible over bright footage, without adding a visible border -->
    <feMorphology in="SourceAlpha" operator="dilate" radius="3.072" result="grow"/>
    <feGaussianBlur in="grow" stdDeviation="2.048" result="sblur"/>
    <feFlood flood-color="#000000" flood-opacity="0.88" result="scol"/>
    <feComposite in="scol" in2="sblur" operator="in" result="shadow"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="4.608" result="gblur"/>
    <feFlood flood-color="#D4AF37" flood-opacity="0.65" result="gcol"/>
    <feComposite in="gcol" in2="gblur" operator="in" result="gglow"/>
    <feMerge>
      <feMergeNode in="shadow"/>
      <feMergeNode in="gglow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <linearGradient id="WEGold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F2DFA0"/><stop offset=".3" stop-color="#D4AF37"/>
    <stop offset=".62" stop-color="#8A6D1F"/><stop offset=".85" stop-color="#D4AF37"/>
    <stop offset="1" stop-color="#F2DFA0"/>
  </linearGradient>
  <filter id="WEGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

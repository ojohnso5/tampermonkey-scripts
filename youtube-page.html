<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YouTube</title>
<style>
  :root{
    --bg:#0f0f0f; --bg-elev:#181818; --bg-hover:#272727; --bg-active:#3f3f3f;
    --text:#f1f1f1; --text-dim:#aaaaaa; --line:#303030;
    --chip:#272727; --chip-hover:#3f3f3f;
    --accent:#ff0000; --blue:#3ea6ff;
    --sidebar:240px; --topbar:56px;
  }
  html[data-theme="light"]{
    --bg:#ffffff; --bg-elev:#ffffff; --bg-hover:#f2f2f2; --bg-active:#e5e5e5;
    --text:#0f0f0f; --text-dim:#606060; --line:#e5e5e5;
    --chip:#f2f2f2; --chip-hover:#e5e5e5;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"YouTube Sans",Roboto,Arial,Helvetica,sans-serif;font-size:14px}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  .topbar{position:fixed;inset:0 0 auto 0;height:var(--topbar);display:flex;align-items:center;
    gap:16px;padding:0 16px;background:var(--bg);z-index:60}
  .left{flex:0 0 auto;display:flex;align-items:center;gap:8px}
  .icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
  .icon-btn:hover{background:var(--bg-hover)}
  .icon-btn svg{width:24px;height:24px;fill:var(--text)}
  .logo{display:flex;align-items:center;gap:4px;padding:0 14px 0 16px}
  .logo .mark{width:30px;height:21px}
  .logo .word{font-family:Roboto,Arial;font-weight:700;font-size:20px;letter-spacing:-1.2px}
  .search{flex:1 1 auto;display:flex;justify-content:center;max-width:640px}
  .search form{display:flex;flex:1;max-width:560px}
  .search input{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-right:0;
    background:var(--bg);color:var(--text);padding:0 16px;font-size:16px;border-radius:40px 0 0 40px}
  .search input::placeholder{color:var(--text-dim)}
  .search input:focus{outline:1px solid var(--blue);outline-offset:-1px}
  .search button{width:64px;height:40px;border:1px solid var(--line);background:var(--bg-elev);
    border-radius:0 40px 40px 0;display:grid;place-items:center}
  .search button:hover{background:var(--bg-hover)}
  .search button svg{width:24px;height:24px;fill:var(--text)}
  .right{flex:0 0 auto;display:flex;align-items:center;gap:4px;margin-left:auto}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7e57c2,#42a5f5);
    color:#fff;display:grid;place-items:center;font-size:14px;font-weight:600;cursor:pointer;margin-left:8px}
  .mic{position:relative}
  .mic .level{position:absolute;inset:auto 8px 6px 8px;height:3px;border-radius:2px;background:var(--accent);
    transform-origin:left;animation:vu 1.1s infinite ease-in-out}
  @keyframes vu{0%,100%{transform:scaleX(.2)}50%{transform:scaleX(1)}}

  .sidebar{position:fixed;top:var(--topbar);bottom:0;left:0;width:var(--sidebar);
    overflow-y:auto;padding:12px;background:var(--bg);z-index:50;scrollbar-width:thin}
  .sidebar::-webkit-scrollbar{width:8px}
  .sidebar::-webkit-scrollbar-thumb{background:#888;border-radius:4px}
  body.nav-collapsed .sidebar{display:none}
  .side-section{padding:12px 0;border-bottom:1px solid var(--line)}
  .side-section:last-child{border-bottom:0}
  .side-title{font-weight:600;font-size:16px;padding:6px 12px}
  .side-link{display:flex;align-items:center;gap:24px;padding:0 12px;height:40px;border-radius:10px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-link:hover{background:var(--bg-hover)}
  .side-link.active{background:var(--bg-active);font-weight:600}
  .side-link svg{width:24px;height:24px;fill:var(--text);flex:0 0 auto}

  .content{margin-left:var(--sidebar);padding:calc(var(--topbar) + 12px) 24px 48px;transition:margin .15s}
  body.nav-collapsed .content{margin-left:0}
  .chips{display:flex;gap:12px;overflow-x:auto;padding:8px 0 16px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{background:var(--chip);border-radius:8px;padding:6px 12px;white-space:nowrap;font-size:14px}
  .chip:hover{background:var(--chip-hover)}
  .chip.active{background:var(--text);color:var(--bg)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:24px 16px}
  .card{cursor:pointer}
  .thumb{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#272727}
  .thumb .dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;
    font-size:12px;font-weight:500;padding:1px 4px;border-radius:4px}
  .thumb .live{position:absolute;left:6px;bottom:6px;background:var(--accent);color:#fff;
    font-size:12px;font-weight:600;padding:1px 5px;border-radius:4px}
  .thumb .hover-play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.35);
    opacity:0;transition:opacity .15s}
  .card:hover .hover-play{opacity:1}
  .hover-play .pill{background:var(--accent);border-radius:50%;width:52px;height:52px;display:grid;place-items:center}
  .hover-play svg{width:26px;height:26px;fill:#fff;margin-left:4px}
  .meta{display:flex;gap:12px;padding:12px 4px 0}
  .meta .avatar{width:36px;height:36px;margin:0;flex:0 0 auto}
  .meta h3{margin:0;font-size:16px;font-weight:500;line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta p{margin:4px 0 0;color:var(--text-dim);font-size:14px}
  .menu{margin-left:auto;align-self:flex-start;opacity:0;padding:4px;border-radius:50%;height:32px}
  .card:hover .menu{opacity:1}
  .menu:hover{background:var(--bg-hover)}
  .menu svg{width:20px;height:20px;fill:var(--text)}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;z-index:100;
    align-items:center;justify-content:center;padding:40px 16px}
  .modal.open{display:flex}
  .modal-box{background:#000;border-radius:12px;width:min(1100px,100%);overflow:hidden}
  .modal-stage{aspect-ratio:16/9;background:#000;display:grid;place-items:center;position:relative}
  .modal-stage .fake-play{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.15);
    display:grid;place-items:center}
  .fake-play svg{width:34px;height:34px;fill:#fff;margin-left:5px}
  .modal-info{display:flex;gap:16px;padding:16px;color:#f1f1f1}
  .modal-info h2{margin:0 0 8px;font-size:18px}
  .modal-info p{margin:0;color:#aaa;font-size:14px}
  .modal-close{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;
    background:rgba(0,0,0,.6);display:grid;place-items:center}
  .modal-close svg{width:24px;height:24px;fill:#fff}
  .modal-close:hover{background:var(--bg-active)}

  .empty{color:var(--text-dim);padding:60px 0;text-align:center;font-size:16px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#fff;color:#0f0f0f;
    padding:12px 20px;border-radius:8px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.4);
    opacity:0;pointer-events:none;transition:opacity .2s;z-index:200}
  .toast.show{opacity:1}

  @media (max-width:1000px){ .sidebar{display:none} .content{margin-left:0} }
  @media (max-width:640px){
    .logo .word{display:none}
    .logo{padding:0 4px}
    .topbar{gap:8px;padding:0 8px}
    .right .icon-btn{display:none}
    .right .avatar{margin-left:0}
    .search{max-width:none}
    .search button{width:48px;border-radius:0 40px 40px 0}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="left">
    <button class="icon-btn" id="navToggle" title="Menu" aria-label="Toggle menu">
      <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
    </button>
    <a class="logo" href="#">
      <svg class="mark" viewBox="0 0 28 20"><path fill="#ff0000" d="M27.4 3.1a3.5 3.5 0 0 0-2.5-2.5C22.8 0 14 0 14 0S5.2 0 3.1.6A3.5 3.5 0 0 0 .6 3.1C0 5.2 0 10 0 10s0 4.8.6 6.9a3.5 3.5 0 0 0 2.5 2.5C5.2 20 14 20 14 20s8.8 0 10.9-.6a3.5 3.5 0 0 0 2.5-2.5C28 14.8 28 10 28 10s0-4.8-.6-6.9z"/><path fill="#fff" d="M11.2 14.3 18.5 10l-7.3-4.3z"/></svg>
      <span class="word">YouTube</span>
    </a>
  </div>

  <div class="search">
    <form id="searchForm">
      <input id="q" type="search" placeholder="Search" autocomplete="off" />
      <button type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24"><path d="M20.9 20.5 17 16.6a7.5 7.5 0 1 0-1.4 1.4l3.9 3.9zM10.5 15a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
      </button>
    </form>
  </div>

  <div class="right">
    <button class="icon-btn mic" title="Search with your voice" aria-label="Voice search">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg>
      <span class="level"></span>
    </button>
    <button class="icon-btn" title="Create" aria-label="Create">
      <svg viewBox="0 0 24 24"><path d="M12 4a1 1 0 0 1 1 1v5h5a1 1 0 1 1 0 2h-5v5a1 1 0 1 1-2 0v-5H6a1 1 0 1 1 0-2h5V5a1 1 0 0 1 1-1z"/></svg>
    </button>
    <button class="icon-btn" title="Notifications" aria-label="Notifications">
      <svg viewBox="0 0 24 24"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm7-6v-5a7 7 0 0 0-5-6.7V3a2 2 0 0 0-4 0v1.3A7 7 0 0 0 5 11v5l-2 2v1h18v-1z"/></svg>
    </button>
    <div class="avatar" title="Account">OJ</div>
  </div>
</header>

<aside class="sidebar" id="sidebar"></aside>

<main class="content">
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No results found</div>
</main>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-stage">
      <button class="modal-close" id="modalClose" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M18.3 5.7 12 12l-6.3-6.3-1.4 1.4L10.6 13.4 4.3 19.7l1.4 1.4L12 14.8l6.3 6.3 1.4-1.4-6.3-6.3 6.3-6.3z"/></svg>
      </button>
      <div class="fake-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    </div>
    <div class="modal-info">
      <div class="avatar" id="mAvatar">OJ</div>
      <div>
        <h2 id="mTitle"></h2>
        <p id="mMeta"></p>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ICONS = {
  home:'M12 3 2 12h3v9h6v-6h2v6h6v-9h3z',
  shorts:'M10 14.65v-5.3L15 12zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2m0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8m4.59-12.42L10 14.83V9.17l6.59 3.41z',
  subs:'M10 18v-6l5 3-5 3m7-15H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2m0 16H7V7h13z',
  you:'M12 4a4 4 0 1 1 0 8 4 4 0 0 1 0-8m0 10c4.42 0 8 1.79 8 4v2H4v-2c0-2.21 3.58-4 8-4',
  history:'M13 3a9 9 0 0 0-9 9H1l4 4 4-4H6a7 7 0 1 1 2.05 4.95l-1.42 1.42A9 9 0 1 0 13 3m-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8z',
  playlist:'M3 10h12v2H3zm0-4h12v2H3zm0 8h8v2H3zm14-6v10l5-5z',
  your:'M11 7H9v10h2zm4-3h-2v13h2zM3 9h2v10H3zm16-2H7v2h12z',
  watchlater:'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20m0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16m.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7z',
  like:'M18.8 5.1 12 2 3.7 8.3a3 3 0 0 0-.9 2.1v9.1a3 3 0 0 0 3 3h12.4a3 3 0 0 0 3-2.4l1.6-8a3 3 0 0 0-3-4z',
  store:'M20 4H4v2h16zm1 10V8H3v6zm-4-3h2v2h-2zm-6 2h6v2h-6z'
};
const svg = d => '<svg viewBox="0 0 24 24"><path d="'+d+'"/></svg>';

const NAV = [
  { title:'YouTube', links:[
    {icon:'home', label:'Home'},
    {icon:'shorts', label:'Shorts'},
    {icon:'subs', label:'Subscriptions'}
  ]},
  { title:'You', links:[
    {icon:'you', label:'Your channel'},
    {icon:'history', label:'History'},
    {icon:'playlist', label:'Playlists'},
    {icon:'your', label:'Your videos'},
    {icon:'watchlater', label:'Watch later'},
    {icon:'like', label:'Liked videos'}
  ]},
  { title:'Explore', links:[
    {icon:'store', label:'Explore'},
    {icon:'store', label:'Trending'},
    {icon:'store', label:'Music'},
    {icon:'store', label:'Gaming'}
  ]}
];

const CHANNELS = ['DigiWave','Nova Labs','Aria Craft','Pixel Forge','Echo Studio','Orbit Tech','Lumen Co','Vertex Media'];
const TITLES = [
  'Building a Full-Stack App in 30 Minutes','The Art of Clean Code','Deep Dive: Neural Networks Explained',
  'Top 10 Hidden Gems in Japan','How I Edit Videos 10x Faster','Lo-fi Beats to Study To',
  'Every CSS Trick You Need to Know','React vs Vue in 2025','Live Coding: Multiplayer Game',
  'The Science of Sleep and Focus','Home Studio Setup on a Budget','Advanced Guitar Techniques',
  'Machine Learning in 10 Minutes','Ramen Like a Pro','Solo Travel in Iceland',
  'Mastering Color Grading','Rust in Action','Minimalist Desk Setup Tour'
];
const TAGS = ['All','Music','Gaming','Tech','Cooking','Travel','Education','Podcasts','Live','Recently uploaded','Watched','New to you'];
const GRADS = [
  'linear-gradient(135deg,#7f5af0,#2cb67d)','linear-gradient(135deg,#f6416c,#ff9f43)',
  'linear-gradient(135deg,#2b5876,#4e4376)','linear-gradient(135deg,#00b09b,#96c93d)',
  'linear-gradient(135deg,#ff6a00,#ee0979)','linear-gradient(135deg,#0f2027,#2c5364)',
  'linear-gradient(135deg,#3a3d40,#181719)','linear-gradient(135deg,#232526,#414345)',
  'linear-gradient(135deg,#e65c00,#f9d423)','linear-gradient(135deg,#0061ff,#60efff)',
  'linear-gradient(135deg,#654ea3,#eaafc8)','linear-gradient(135deg,#22c1c3,#fdbb2d)'
];

const VIDEOS = Array.from({length:24}, function(_,i){
  return {
    id:'v'+i,
    title: TITLES[i % TITLES.length] + (i >= TITLES.length ? ' — Part ' + (Math.floor(i/TITLES.length)+1) : ''),
    channel: CHANNELS[i % CHANNELS.length],
    views: (Math.floor(Math.random()*900)+12) + 'K views',
    age: ['2 hours ago','yesterday','3 days ago','1 week ago','2 weeks ago','1 month ago'][i%6],
    dur: ['10:04','3:21','15:48','8:00','22:15','1:02:33','47:12','6:45'][i%8],
    grad: GRADS[i % GRADS.length],
    live: i % 9 === 4
  };
});

var state = { chip:'All', query:'', collapsed:false };

function renderSidebar(){
  document.getElementById('sidebar').innerHTML = NAV.map(function(sec){
    return '<div class="side-section">' +
      (sec.title ? '<div class="side-title">' + sec.title + '</div>' : '') +
      sec.links.map(function(l){
        return '<a class="side-link' + (l.label==='Home'?' active':'') + '" href="#" title="' + l.label + '">' +
          svg(ICONS[l.icon]) + '<span>' + l.label + '</span></a>';
      }).join('') + '</div>';
  }).join('');
}

function renderChips(){
  document.getElementById('chips').innerHTML = TAGS.map(function(t){
    return '<button class="chip' + (t===state.chip?' active':'') + '" data-chip="' + t + '">' + t + '</button>';
  }).join('');
}

const CHIP_KEYWORDS = {
  Music:['music','lo-fi','beats','guitar','song','album','studio'],
  Gaming:['game','gaming','multiplayer','rpg','speedrun'],
  Tech:['css','code','react','vue','rust','ml','machine learning','full-stack','app','setup','networks','tech'],
  Cooking:['cook','ramen','recipe','food','kitchen'],
  Travel:['travel','japan','iceland','solo','city'],
  Education:['learn','explained','science','mastering','how to','tips','trick'],
  Podcasts:['podcast','interview','episode','talk']
};

function matchesChip(v, chip){
  if(chip === 'All') return true;
  if(chip === 'Live') return v.live;
  if(chip === 'Watched') return v.age !== '2 hours ago';
  if(chip === 'Recently uploaded') return v.age === '2 hours ago' || v.age === 'yesterday';
  if(chip === 'New to you') return v.age === '3 days ago' || v.age === '1 week ago';
  if(chip === 'Podcasts') return CHIP_KEYWORDS.Podcasts.some(k => v.title.toLowerCase().indexOf(k) !== -1);
  var keys = CHIP_KEYWORDS[chip];
  if(keys) return keys.some(k => v.title.toLowerCase().indexOf(k) !== -1);
  return v.title.toLowerCase().indexOf(chip.toLowerCase()) !== -1;
}

function renderGrid(){
  var q = state.query.toLowerCase();
  var list = VIDEOS.filter(function(v){
    var okQ = !q || v.title.toLowerCase().indexOf(q) !== -1 || v.channel.toLowerCase().indexOf(q) !== -1;
    return okQ && matchesChip(v, state.chip);
  });
  var grid = document.getElementById('grid');
  document.getElementById('empty').hidden = list.length > 0;
  grid.innerHTML = list.map(function(v){
    return '<article class="card" data-id="' + v.id + '">' +
      '<div class="thumb" style="background:' + v.grad + '">' +
        (v.live ? '<span class="live">LIVE</span>' : '') +
        '<span class="dur">' + v.dur + '</span>' +
        '<div class="hover-play"><span class="pill"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span></div>' +
      '</div>' +
      '<div class="meta">' +
        '<div class="avatar">' + v.channel.slice(0,1) + '</div>' +
        '<div style="min-width:0"><h3>' + v.title + '</h3><p>' + v.channel + '</p>' +
        '<p>' + v.views + ' • ' + v.age + '</p></div>' +
        '<button class="menu" aria-label="More options"><svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4m0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4m0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4"/></svg></button>' +
      '</div></article>';
  }).join('');
}

function openModal(id){
  var v = VIDEOS.find(function(x){ return x.id === id; });
  if(!v) return;
  document.getElementById('mTitle').textContent = v.title;
  document.getElementById('mMeta').textContent = v.channel + ' • ' + v.views + ' • ' + v.age;
  document.getElementById('mAvatar').textContent = v.channel.slice(0,1);
  document.getElementById('modal').classList.add('open');
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }

var toastTimer;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

document.getElementById('navToggle').addEventListener('click', function(){
  state.collapsed = !state.collapsed;
  document.body.classList.toggle('nav-collapsed', state.collapsed);
});
document.getElementById('chips').addEventListener('click', function(e){
  var b = e.target.closest('.chip'); if(!b) return;
  state.chip = b.dataset.chip; renderChips(); renderGrid();
});
document.getElementById('grid').addEventListener('click', function(e){
  var card = e.target.closest('.card'); if(!card) return;
  openModal(card.dataset.id);
});
document.getElementById('grid').addEventListener('contextmenu', function(e){
  e.preventDefault(); toast('Menu is not available in this demo');
});
document.getElementById('searchForm').addEventListener('submit', function(e){
  e.preventDefault();
  state.query = document.getElementById('q').value.trim();
  renderGrid();
  if(!state.query) toast('Showing all videos');
});
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modal').addEventListener('click', function(e){
  if(e.target.id === 'modal') closeModal();
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeModal();
  if(e.key === '/' && document.activeElement !== document.getElementById('q')){
    e.preventDefault(); document.getElementById('q').focus();
  }
});
document.querySelector('.mic').addEventListener('click', function(){ toast('Voice search is not available in this demo'); });

renderSidebar();
renderChips();
renderGrid();
</script>
</body>
</html>
